# Connectly - run on another PC from Docker Hub images (no build needed).
# Image names use your Docker Hub account: saadmdminhaz/connectly-*
#
# USAGE on the new PC:
#   docker login
#   docker compose -f docker-compose.otherpc.yml pull
#   docker compose -f docker-compose.otherpc.yml up -d
#   docker compose -f docker-compose.otherpc.yml ps
#
# NOTE: needs the 'sql/' and 'certs/' folders next to this file.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: whatsapp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourPassword123}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD:-YourPassword123}" -Q "SELECT 1" -C -No
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: whatsapp-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourPassword123}"
    entrypoint: ["/bin/bash", "/sql/db-init.sh"]
    command: []
    volumes:
      - ./sql:/sql
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: whatsapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-server:
    image: saadmdminhaz/connectly-auth-server:latest
    container_name: whatsapp-auth-server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=whatsapp_auth;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-YourPassword123}"
      USER_SERVICE_BASE_URL: http://user-service:8081
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  user-service:
    image: saadmdminhaz/connectly-user-service:latest
    container_name: whatsapp-user-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=whatsapp_users;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-YourPassword123}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  chat-service:
    image: saadmdminhaz/connectly-chat-service:latest
    container_name: whatsapp-chat-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=whatsapp_chat;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-YourPassword123}"
      GATEWAY_SERVICE_BASE_URL: http://gateway-service:8084
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      gateway-service:
        condition: service_started
    restart: unless-stopped

  media-service:
    image: saadmdminhaz/connectly-media-service:latest
    container_name: whatsapp-media-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=whatsapp_media;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-YourPassword123}"
      MEDIA_UPLOAD_DIR: /app/uploads
    volumes:
      - media-uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway-service:
    image: saadmdminhaz/connectly-gateway-service:latest
    container_name: whatsapp-gateway-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: saadmdminhaz/connectly-frontend:latest
    container_name: whatsapp-frontend
    ports:
      - "4200:4200"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      auth-server:
        condition: service_started
      user-service:
        condition: service_started
      chat-service:
        condition: service_started
      media-service:
        condition: service_started
      gateway-service:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  media-uploads:
